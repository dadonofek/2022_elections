/* ---- Leaflet 1.9.4 ---- */
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {

}
.leaflet-container a {

}
.leaflet-tile {

	}
.leaflet-tile-loaded {

	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }

	}


/* control positioning */

.leaflet-control {

	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,

/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {

/* ---------- design tokens ---------- */
:root{
  color-scheme: light;
  --surface-0:#f4f3f0; --surface-1:#fcfcfb; --surface-2:#eceae5;
  --border:#dcd9d2; --border-strong:#bfbbb2;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#77756e;
  --bloc-coalition:#eb6834; --bloc-opposition:#2a78d6; --bloc-other:#1baf7a;
  --accent:#2a78d6; --accent-ink:#fff;
  --ring:#fcfcfb;
  /* turnout ramp: purple — deliberately not a bloc colour so it never reads as a party */
  --seq-0:#eadcf3; --seq-1:#d0aee4; --seq-2:#b681d3; --seq-3:#9455b8; --seq-4:#6f3a90; --seq-5:#4a2465;
  --div-opp-3:#1c5cab; --div-opp-2:#3987e5; --div-opp-1:#9ec5f4;
  --div-mid:#e6e4df;
  --div-coal-1:#f6c3a7; --div-coal-2:#ef8f5f; --div-coal-3:#c94f1c;
  /* turnout-delta ramp (rose). Sequential, not diverging: measured against the
     national average most of the city's sites sit below it, so the data is
     one-sided. Rose is the one hue far enough from both bloc hues — the opposition
     blue and the coalition orange — to never read as a bloc (worst CVD dE 11.2 / 12.5);
     validated with the dataviz skill's validator as an ordinal ramp. */
  --dlt-none:#b0ada4;
  --dlt-0:#fe87af; --dlt-1:#e46f97; --dlt-2:#ca5881; --dlt-3:#b0416b; --dlt-4:#972956;
  /* potential ramps: hue says WHICH bloc, lightness says HOW MANY votes. These and the
     rose ramp above are NOT redefined for dark mode: the legend says "big and dark =
     a lot still on the table", so darker has to keep meaning "more" in both themes.
     Every dark end still clears 2.5:1 against the dark surface. */
  --pot-coal-0:#fe9671; --pot-coal-1:#f5713e; --pot-coal-2:#db5923; --pot-coal-3:#bf4301; --pot-coal-4:#9c3604;
  --pot-opp-0:#7db5ff; --pot-opp-1:#509cfd; --pot-opp-2:#3784e4; --pot-opp-3:#1d6dca; --pot-opp-4:#0557ac;
  --pot-oth-0:#42c891; --pot-oth-1:#1caf7a; --pot-oth-2:#149567; --pot-oth-3:#0c7c55; --pot-oth-4:#056443;
  /* הדמוקרטים: a camp INSIDE the opposition bloc, so it cannot borrow a bloc hue.
     Teal, OKLCH hue 210 — the free hue that keeps CVD dE >= 10 from all three bloc
     colours (16 / 13 / 10 against the blue, the orange and the green at the deep end,
     whichever bloc currently wears which); rose is taken by the delta ramp and purple
     by turnout. Validated as an ordinal ramp: monotone L, adjacent dL >= 0.06, light
     end 2.19:1 on the light surface. Not redefined for dark mode either — its dark end
     clears 2.57:1 there, the widest margin of any ramp here. */
  --camp-dem:#006572;
  --pot-dem-0:#00bed5; --pot-dem-1:#00a7bc; --pot-dem-2:#0090a2; --pot-dem-3:#007a8a; --pot-dem-4:#006572;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 6px 20px rgba(0,0,0,.08);
  --radius:10px;
  --sidebar-w:380px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --surface-0:#121211; --surface-1:#1a1a19; --surface-2:#242423;
    --border:#33332f; --border-strong:#4a4a45;
    --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#94938a;
    --bloc-coalition:#d95926; --bloc-opposition:#3987e5; --bloc-other:#199e70;
    --accent:#3987e5; --accent-ink:#0b0b0b;
    --ring:#1a1a19;
    --seq-0:#3d1d5c; --seq-1:#5c2f82; --seq-2:#7e4aa6; --seq-3:#a273c6; --seq-4:#c6a0e0; --seq-5:#e6d3f4;
    --div-opp-3:#9ec5f4; --div-opp-2:#3987e5; --div-opp-1:#1c5cab;
    --div-mid:#383835;
    --div-coal-1:#8a4423; --div-coal-2:#d95926; --div-coal-3:#f0a077;
    --dlt-none:#5b5b54;
    --camp-dem:#00707e;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface-0:#121211; --surface-1:#1a1a19; --surface-2:#242423;
  --border:#33332f; --border-strong:#4a4a45;
  --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#94938a;
  --bloc-coalition:#d95926; --bloc-opposition:#3987e5; --bloc-other:#199e70;
  --accent:#3987e5; --accent-ink:#0b0b0b;
  --ring:#1a1a19;
  --seq-0:#3d1d5c; --seq-1:#5c2f82; --seq-2:#7e4aa6; --seq-3:#a273c6; --seq-4:#c6a0e0; --seq-5:#e6d3f4;
  --div-opp-3:#9ec5f4; --div-opp-2:#3987e5; --div-opp-1:#1c5cab;
  --div-mid:#383835;
  --div-coal-1:#8a4423; --div-coal-2:#d95926; --div-coal-3:#f0a077;
  --dlt-none:#5b5b54;
  --camp-dem:#00707e;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.5);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; direction:rtl;
  font-family:"Assistant","Heebo","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  background:var(--surface-0); color:var(--text-primary);
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
.app{display:flex; flex-direction:column; height:100vh; overflow:hidden}

/* ---------- header ---------- */
header{
  display:flex; align-items:center; gap:20px; flex-wrap:wrap; position:relative;
  padding:10px 18px; background:var(--surface-1);
  border-bottom:1px solid var(--border); z-index:20;
}
.brand h1{margin:0; font-size:17px; font-weight:700; letter-spacing:-.2px}
.brand p{margin:1px 0 0; font-size:12px; color:var(--text-muted)}
.stats{display:flex; gap:6px; margin-inline-start:auto; flex-wrap:wrap}
.stat{
  background:var(--surface-2); border:1px solid var(--border);
  border-radius:var(--radius); padding:5px 11px; min-width:82px;
}
.stat .v{font-size:16px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.2}
.stat .k{font-size:11px; color:var(--text-muted); white-space:nowrap}
.btn.statsmore{display:none; padding:5px 9px; font-size:12px}
.hamburger{display:none; font-size:16px; line-height:1; padding:7px 11px}
.hdr-actions{display:flex; gap:6px}

/* ---------- buttons ---------- */
button{font:inherit; color:inherit; cursor:pointer}
.btn{
  background:var(--surface-1); border:1px solid var(--border-strong);
  border-radius:8px; padding:6px 11px; font-size:13px;
}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent}
.seg{display:flex; background:var(--surface-2); border:1px solid var(--border); border-radius:9px; padding:2px; gap:2px}
.seg.grid3{display:grid; grid-template-columns:repeat(3,1fr)}
.seg button{
  flex:1; border:0; background:transparent; border-radius:7px;
  padding:6px 8px; font-size:12.5px; color:var(--text-secondary); white-space:nowrap;
}
.seg button[aria-pressed="true"]{background:var(--surface-1); color:var(--text-primary); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.08)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ---------- layout ---------- */
.main{flex:1; display:flex; min-height:0; position:relative}
/* the wrapper owns the overlays so they stay pinned to the map in every layout,
   and isolates Leaflet's internal pane z-indexes from the page */
.mapwrap{flex:1; min-width:0; position:relative; z-index:0; isolation:isolate}
#map{position:absolute; inset:0; background:var(--surface-2)}
.sidebar{
  position:relative;                      /* the detail overlay is positioned against this */
  width:var(--sidebar-w); flex:0 0 var(--sidebar-w);
  background:var(--surface-1); border-inline-end:1px solid var(--border);
  display:flex; flex-direction:column; min-height:0; z-index:10;
}
.panel{padding:12px 14px; border-bottom:1px solid var(--border)}
.panel h2{margin:0 0 8px; font-size:12px; font-weight:700; color:var(--text-muted); letter-spacing:.4px}
.scroll{overflow-y:auto; min-height:0; flex:1; scrollbar-width:thin}

/* ---------- form controls ---------- */
.field{margin-bottom:10px}
.field:last-child{margin-bottom:0}
label.lab{display:block; font-size:12px; color:var(--text-secondary); margin-bottom:4px}
input[type=search],input[type=text],select{
  width:100%; font:inherit; font-size:13px; padding:7px 9px;
  border:1px solid var(--border-strong); border-radius:8px;
  background:var(--surface-1); color:var(--text-primary);
}
input[type=range]{width:100%; accent-color:var(--accent)}
.dualrange{display:flex; flex-direction:column; gap:2px}
.chips{display:flex; gap:5px; flex-wrap:wrap}
.chip{
  display:inline-flex; align-items:center; gap:6px; font-size:12.5px;
  border:1px solid var(--border-strong); background:var(--surface-1);
  border-radius:20px; padding:4px 10px; cursor:pointer; user-select:none;
}
.chip input{display:none}
.chip .dot{width:9px; height:9px; border-radius:50%; flex:none}
.chip[data-on="0"]{opacity:.42; text-decoration:line-through}
.rangeval{font-variant-numeric:tabular-nums; color:var(--text-primary); font-weight:600}

/* ---------- legend ---------- */
.legend-row{display:flex; align-items:center; gap:8px; font-size:12.5px; margin-bottom:5px}
.legend-row .sw{width:13px; height:13px; border-radius:4px; flex:none; box-shadow:0 0 0 1px rgba(11,11,11,.18)}
.legend-row .n{margin-inline-start:auto; color:var(--text-muted); font-variant-numeric:tabular-nums; font-size:11.5px}
.ramp{display:flex; height:11px; border-radius:4px; overflow:hidden; gap:2px; margin:4px 0 3px}
.ramp span{flex:1; box-shadow:0 0 0 1px rgba(11,11,11,.12) inset}
.ramp-labels{display:flex; justify-content:space-between; font-size:11px; color:var(--text-muted); font-variant-numeric:tabular-nums}
.legend-note{margin:6px 0 0; font-size:11px; line-height:1.35; color:var(--text-muted)}
.size-legend{display:flex; align-items:flex-end; gap:12px; margin-top:8px; padding-top:8px; border-top:1px solid var(--border)}
.size-legend .b{display:flex; flex-direction:column; align-items:center; gap:3px; font-size:11px; color:var(--text-muted)}
.size-legend i{display:block; border-radius:50%; background:transparent; border:1.5px solid var(--text-muted)}

/* ---------- site list ---------- */
.listhead{display:flex; align-items:center; gap:8px; padding:9px 14px; border-bottom:1px solid var(--border); font-size:12px; color:var(--text-muted)}
.listhead select{width:auto; padding:4px 6px; font-size:12px; margin-inline-start:auto}
.site{
  display:block; width:100%; text-align:start; background:transparent;
  border:0; border-bottom:1px solid var(--border); padding:9px 14px;
}
.site:hover{background:var(--surface-2)}
.site[aria-current="true"]{background:var(--surface-2); box-shadow:inset -3px 0 0 var(--accent)}
.site .t{display:flex; align-items:center; gap:7px}
.site .nm{font-weight:600; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.site .ad{font-size:12px; color:var(--text-muted); margin-top:1px}
.site .m{display:flex; gap:10px; font-size:11.5px; color:var(--text-secondary); margin-top:4px; font-variant-numeric:tabular-nums}
.pill{font-size:11px; padding:1px 7px; border-radius:20px; border:1px solid var(--border-strong); color:var(--text-secondary); white-space:nowrap}
.dot{width:9px; height:9px; border-radius:50%; flex:none; box-shadow:0 0 0 1px rgba(11,11,11,.22)}

/* ---------- detail ---------- */
.detail{position:absolute; inset:0; background:var(--surface-1); display:flex; flex-direction:column; z-index:5}
.detail-head{padding:12px 14px; border-bottom:1px solid var(--border)}
.detail-head .row{display:flex; align-items:flex-start; gap:8px}
.detail-head h3{margin:0; font-size:15px; font-weight:700}
.detail-head .ad{font-size:12.5px; color:var(--text-secondary); margin-top:2px}
.kpis{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:10px}
.kpi{background:var(--surface-2); border-radius:8px; padding:6px 8px}
.kpi .v{font-size:15px; font-weight:700; font-variant-numeric:tabular-nums}
.kpi .k{font-size:11px; color:var(--text-muted)}
.sec{padding:12px 14px; border-bottom:1px solid var(--border)}
.sec h4{margin:0 0 8px; font-size:12px; color:var(--text-muted); font-weight:700; letter-spacing:.4px}
details.sec > summary{margin:0; font-size:12px; color:var(--text-muted); font-weight:700; letter-spacing:.4px; cursor:pointer; list-style:none; user-select:none}
details.sec > summary::-webkit-details-marker{display:none}
details.sec > summary::before{content:"\25B8"; display:inline-block; margin-inline-end:6px}
details.sec[open] > summary{margin-bottom:8px}
details.sec[open] > summary::before{content:"\25BE"}
.stack{display:flex; height:12px; border-radius:4px; overflow:hidden; gap:2px; background:var(--surface-2)}
.stack > span{display:block; height:100%}
.stack-key{display:flex; flex-direction:column; gap:5px; margin-top:8px; font-size:12.5px}
.stack-key .i{display:flex; align-items:center; gap:7px}
.stack-key .i .lbl{flex:1}
.stack-key .i .pc{font-variant-numeric:tabular-nums; font-weight:700}
.stack-key .i .abs{font-variant-numeric:tabular-nums; color:var(--text-muted); min-width:54px; text-align:end}
.bars{display:flex; flex-direction:column; gap:6px}
.bar{display:grid; grid-template-columns:96px 1fr 92px; align-items:center; gap:8px; font-size:12.5px}
.bar .track{display:block; height:9px; background:var(--surface-2); border-radius:4px; overflow:hidden}
.bar .fill{display:block; height:100%; border-radius:4px}
.bar .val{text-align:end; white-space:nowrap; font-variant-numeric:tabular-nums; color:var(--text-secondary)}
table.kt{width:100%; border-collapse:collapse; font-size:12.5px; font-variant-numeric:tabular-nums}
table.kt th{text-align:start; font-weight:600; color:var(--text-muted); font-size:11.5px; padding:4px 6px; border-bottom:1px solid var(--border)}
table.kt td{padding:5px 6px; border-bottom:1px solid var(--border)}
table.kt tbody tr:hover{background:var(--surface-2)}
.muted{color:var(--text-muted)}
.warn{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; color:var(--text-secondary); background:var(--surface-2); border:1px solid var(--border); border-radius:6px; padding:3px 7px; margin-top:8px}

/* ---------- map bits ---------- */
.leaflet-container{font:inherit; background:var(--surface-2)}
/* mute the basemap: keeps Hebrew street names legible while the data markers lead */
#map .leaflet-tile-pane{filter:saturate(.2) brightness(1.08) contrast(.9); opacity:.92}
#map.tiles-dark .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) saturate(.16) brightness(.88) contrast(.86); opacity:.9}
.leaflet-popup-content-wrapper{
  border-radius:12px; box-shadow:var(--shadow);
  background:var(--surface-1); color:var(--text-primary);
  border:1px solid var(--border);
}
.leaflet-popup-tip{background:var(--surface-1); border:1px solid var(--border)}
.leaflet-popup-content{margin:11px 13px; direction:rtl; line-height:1.45}
.leaflet-popup-close-button{color:var(--text-muted)}
.leaflet-popup-close-button:hover{color:var(--text-primary)}
/* the compact card a marker tap opens on a touch layout */
.mcard{direction:rtl; text-align:start}
.mcard b{display:block; font-size:13.5px; line-height:1.3; padding-inline-start:22px}
.mcard .ad{font-size:11.5px; color:var(--text-muted); margin:1px 0 8px}
.mcard .row{display:flex; align-items:center; gap:10px; font-size:12.5px; padding:3px 0}
.mcard .row > span:first-child{color:var(--text-secondary); white-space:nowrap}
.mcard .row .v{
  margin-inline-start:auto; font-weight:700; font-variant-numeric:tabular-nums;
  display:flex; align-items:center; gap:5px; white-space:nowrap;
}
.mcard .mcard-more{width:100%; margin-top:10px; text-align:center; padding:9px 10px; font-size:13px}
.leaflet-tooltip.tip{
  direction:rtl; text-align:start; background:var(--surface-1); color:var(--text-primary);
  border:1px solid var(--border-strong); border-radius:9px; box-shadow:var(--shadow);
  padding:7px 9px; font-size:12.5px; white-space:nowrap;
}
.leaflet-tooltip.tip::before{display:none}
.tip b{display:block; font-size:13px; margin-bottom:2px}
.tip .r{display:flex; gap:8px; color:var(--text-secondary); font-variant-numeric:tabular-nums}
.tip .lead{display:flex; align-items:center; gap:5px; margin-top:3px}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .dot{box-shadow:0 0 0 1px rgba(255,255,255,.28)}
  :root:not([data-theme="light"]) .legend-row .sw{box-shadow:0 0 0 1px rgba(255,255,255,.24)}
  :root:not([data-theme="light"]) .ramp span{box-shadow:0 0 0 1px rgba(255,255,255,.16) inset}
}
:root[data-theme="dark"] .dot{box-shadow:0 0 0 1px rgba(255,255,255,.28)}
:root[data-theme="dark"] .legend-row .sw{box-shadow:0 0 0 1px rgba(255,255,255,.24)}
:root[data-theme="dark"] .ramp span{box-shadow:0 0 0 1px rgba(255,255,255,.16) inset}
.leaflet-tooltip.lbl{
  background:transparent; border:0; box-shadow:none; padding:0; color:var(--text-primary);
  font-size:11.5px; font-weight:600; direction:rtl;
  text-shadow:0 0 3px var(--ring),0 0 3px var(--ring),0 0 3px var(--ring),0 0 5px var(--ring);
}
.leaflet-tooltip.lbl::before{display:none}
.mapbar{
  position:absolute; top:10px; right:10px; z-index:600;
  display:flex; gap:6px; align-items:center;
}
.mapbar .btn{box-shadow:var(--shadow)}
/* the colour controls on the map are for the stacked layout only — on a wide screen
   the filter panel sits beside the map and duplicating them would just be noise */
.mapbar .mapctl{display:none}
.legendbox{
  position:absolute; bottom:34px; inset-inline-start:10px; z-index:600;
  background:var(--surface-1); border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:10px 12px; width:216px;
}
.legendbox h3{margin:0 0 7px; font-size:12px; color:var(--text-muted); font-weight:700}
.leaflet-control-attribution{font-size:10px; direction:ltr; background:var(--surface-1); color:var(--text-secondary)}
.leaflet-control-attribution a{color:var(--text-secondary)}
.leaflet-bar a,.leaflet-bar a:hover{
  background:var(--surface-1); color:var(--text-primary); border-bottom-color:var(--border);
}
.leaflet-bar a:hover{background:var(--surface-2)}
.leaflet-bar{border:1px solid var(--border); box-shadow:var(--shadow)}
.leaflet-control-scale-line{
  background:color-mix(in srgb, var(--surface-1) 82%, transparent); color:var(--text-secondary);
  border-color:var(--border-strong); border-top:none;
}

/* ---------- modal ---------- */
.modal{position:absolute; inset:0; z-index:1100; display:flex; align-items:center; justify-content:center;
  background:rgba(0,0,0,.45); padding:24px}
.modal-card{background:var(--surface-1); border:1px solid var(--border); border-radius:14px;
  box-shadow:var(--shadow); width:min(700px,100%); max-height:100%; display:flex; flex-direction:column}
.modal-head{display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid var(--border)}
.modal-head h2{margin:0; font-size:16px}
.modal-head .btn{margin-inline-start:auto}
.modal-body{overflow-y:auto; padding:16px 18px; font-size:13.5px; line-height:1.6}
.modal-body h3{font-size:13px; color:var(--text-muted); margin:16px 0 6px; letter-spacing:.3px}
.modal-body h3:first-child{margin-top:0}
.modal-body ul{margin:0; padding-inline-start:20px}
.modal-body li{margin-bottom:4px}
.modal-body a{color:var(--accent)}
.modal-body code{background:var(--surface-2); padding:1px 5px; border-radius:5px; font-size:12.5px; direction:ltr; display:inline-block}

/* ---------- table view ---------- */
.tableview{position:absolute; inset:0; background:var(--surface-0); z-index:1000; display:flex; flex-direction:column}
.tv-head{display:flex; align-items:center; gap:10px; padding:10px 16px; border-bottom:1px solid var(--border); background:var(--surface-1)}
.tv-body{overflow:auto; flex:1}
table.full{width:100%; border-collapse:collapse; font-size:12.5px; font-variant-numeric:tabular-nums; background:var(--surface-1)}
table.full th{
  position:sticky; top:0; background:var(--surface-2); z-index:2; text-align:start;
  padding:8px 10px; font-size:11.5px; border-bottom:1px solid var(--border-strong); cursor:pointer; white-space:nowrap;
}
table.full th[aria-sort]{color:var(--accent)}
table.full td{padding:6px 10px; border-bottom:1px solid var(--border); white-space:nowrap}
table.full tbody tr:hover{background:var(--surface-2)}
.hidden{display:none !important}
.empty{padding:24px 14px; text-align:center; color:var(--text-muted); font-size:13px}

/* ---------- mobile view tabs (shown only in the stacked layout) ---------- */
.viewtabs{display:none}
.filters > summary{display:none}
.filters{border:0}

@media (max-width:1000px){
  :root{--sidebar-w:100%}
  .brand h1{font-size:15px}
  .brand p{display:none}
  header{gap:10px; padding:8px 12px}

  /* only the first three tiles ride along; the rest wait behind "עוד" */
  .stats{width:100%; margin-inline-start:0; gap:5px}
  .stats .stat{flex:1 1 calc(33.333% - 4px); min-width:0; padding:5px 8px}
  .stats .stat .v{font-size:15px}
  .stats:not(.expanded) .stat:nth-child(n+4){display:none}
  .btn.statsmore{display:block}

  /* the three utility buttons collapse into a hamburger menu */
  .hamburger{display:block; margin-inline-start:auto}
  .hdr-actions{
    position:absolute; top:100%; inset-inline-end:10px; flex-direction:column;
    background:var(--surface-1); border:1px solid var(--border); border-radius:10px;
    box-shadow:var(--shadow); padding:6px; z-index:900; min-width:160px;
  }
  .hdr-actions:not(.open){display:none}
  .hdr-actions .btn{text-align:start; border:0; background:transparent; padding:9px 10px}
  .hdr-actions .btn:hover{background:var(--surface-2)}

  /* THE FIX: map and list are separate tabs, so neither squeezes the other to
     zero height. Before this, the sidebar got ~126px on a 390x844 phone while
     its panels needed ~338px, and nothing below the map was reachable at all. */
  .main{flex-direction:column}
  .mapwrap{flex:1; min-height:0; height:auto}
  .sidebar{flex:1; border-inline-end:0; border-top:1px solid var(--border); min-height:0}
  body[data-view="list"] .mapwrap{display:none}
  body[data-view="map"] .sidebar{flex:0 0 auto}
  body[data-view="map"] .sidebar > *:not(.viewtabs){display:none}

  .viewtabs{
    display:grid; grid-template-columns:1fr 1fr; gap:2px; flex:none;
    padding:6px 8px; border-bottom:1px solid var(--border); background:var(--surface-2);
  }
  .viewtabs button{
    border:0; background:transparent; border-radius:7px; padding:9px 8px;
    font-size:13px; font-weight:600; color:var(--text-secondary);
  }
  .viewtabs button[aria-pressed="true"]{
    background:var(--surface-1); color:var(--text-primary); box-shadow:0 1px 2px rgba(0,0,0,.08);
  }

  /* filters fold away so the list — the reason to be on this tab — gets the room */
  .filters{flex:none}
  .filters > summary{
    display:flex; align-items:center; gap:8px; padding:10px 14px;
    border-bottom:1px solid var(--border); font-size:12.5px; font-weight:700;
    color:var(--text-secondary); cursor:pointer; list-style:none; user-select:none;
  }
  .filters > summary::-webkit-details-marker{display:none}
  .filters > summary::before{content:"\25B8"; display:inline-block}
  .filters[open] > summary::before{content:"\25BE"}
  .filters > summary .sum{margin-inline-start:auto; font-weight:400; color:var(--text-muted)}
  .filters[open]{overflow-y:auto; max-height:60vh}

  /* the colour mode belongs on the map on a phone: the segmented control is on the
     other tab, so picking a mode meant three taps and no sight of what it painted */
  /* left:52px keeps the row clear of Leaflet's zoom control, which is pinned to the
     physical top-left and paints above this bar */
  .mapbar{left:52px; right:10px; flex-wrap:wrap; justify-content:flex-start}
  .mapbar .mapctl{
    display:block; width:auto; flex:1 1 132px; min-width:0; max-width:210px;
    padding:6px 8px; font-size:12.5px; box-shadow:var(--shadow);
  }

  .legendbox{width:190px; bottom:28px; padding:8px 10px}
  .tv-head{flex-wrap:wrap}
  .modal{padding:10px}
}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand">
      <h1>מפת הקלפיות של בית שמש — הבחירות לכנסת ה-25</h1>
      <p>133 קלפיות ב-44 אתרי הצבעה · נובמבר 2022 · תוצאות רשמיות של ועדת הבחירות המרכזית</p>
    </div>
    <div class="stats" id="stats"></div>
    <button class="btn statsmore" id="btnStatsMore" aria-expanded="false">עוד</button>
    <button class="btn hamburger" id="btnMenu" aria-expanded="false" aria-label="תפריט">☰</button>
    <div class="hdr-actions" id="hdrActions">
      <button class="btn" id="btnAbout">על הנתונים</button>
      <button class="btn" id="btnTable">טבלה</button>
      <button class="btn" id="btnTheme" title="החלפת ערכת צבעים">מצב כהה</button>
    </div>
  </header>

  <div class="main">
    <aside class="sidebar">
      <div class="viewtabs" id="viewTabs" role="group" aria-label="מפה או רשימה">
        <button data-view="map" aria-pressed="false">מפה</button>
        <button data-view="list" aria-pressed="true">רשימה</button>
      </div>

      <details class="filters" id="filters" open>
        <summary>סינון וצביעה <span class="sum" id="filtSummary"></span></summary>
        <div class="panel">
          <h2>צביעת הסמנים</h2>
          <div class="seg grid3" id="modeSeg" role="group" aria-label="בחירת צביעה">
            <button data-mode="potential" aria-pressed="true">פוטנציאל</button>
            <button data-mode="turnout" aria-pressed="false">אחוז הצבעה</button>
            <button data-mode="delta" aria-pressed="false">פער מהארצי</button>
            <button data-mode="lead" aria-pressed="false">גוש מוביל</button>
            <button data-mode="margin" aria-pressed="false">פער בין הגושים</button>
          </div>
          <div class="field" id="potTargetField" style="margin-top:10px">
            <label class="lab" for="potTarget">הגוש שלי — למי שייכים הקולות שלא הגיעו</label>
            <select id="potTarget">
              <option value="none">כל מי שלא הצביע (ללא שיוך)</option>
              <option value="coalition">קואליציית 2022</option>
              <option value="opposition">אופוזיציה רחבה</option>
              <option value="other">רשימות אחרות</option>
            </select>
            <p class="legend-note" id="potNote" style="margin:4px 0 0"></p>
          </div>
        </div>

        <div class="panel">
          <h2>סינון</h2>
          <div class="field">
            <input type="search" id="q" placeholder="חיפוש לפי שם אתר, כתובת או מספר קלפי" aria-label="חיפוש">
          </div>
          <div class="field">
            <label class="lab">טווח אחוז הצבעה: <span class="rangeval" id="turnoutVal">0%–100%</span></label>
            <div class="dualrange">
              <input type="range" id="turnoutMin" min="0" max="100" step="1" value="0" aria-label="אחוז הצבעה מינימלי">
              <input type="range" id="turnoutMax" min="0" max="100" step="1" value="100" aria-label="אחוז הצבעה מקסימלי">
            </div>
          </div>
          <div class="field">
            <label class="lab">גוש מוביל באתר</label>
            <div class="chips" id="blocChips"></div>
          </div>
        </div>
      </details>

      <div class="listhead">
        <span id="count"></span>
        <select id="sort" aria-label="מיון">
          <option value="pot_desc">פוטנציאל — מהגבוה</option>
          <option value="turnout_asc">אחוז הצבעה — מהנמוך</option>
          <option value="delta_asc">פער מהארצי — מהגדול</option>
          <option value="turnout_desc">אחוז הצבעה — מהגבוה</option>
          <option value="voters_desc">מספר מצביעים</option>
          <option value="coal_desc">שיעור קואליציה 2022</option>
          <option value="opp_desc">שיעור אופוזיציה רחבה</option>
          <option value="kalpi">לפי מספר קלפי</option>
        </select>
      </div>
      <div class="scroll" id="list"></div>

      <div class="detail hidden" id="detail"></div>
    </aside>

    <div class="mapwrap">
      <div id="map"></div>
      <div class="mapbar">
        <select id="mapMode" class="mapctl" aria-label="צביעת הסמנים">
          <option value="potential">צביעה: פוטנציאל</option>
          <option value="turnout">צביעה: אחוז הצבעה</option>
          <option value="delta">צביעה: פער מהארצי</option>
          <option value="lead">צביעה: גוש מוביל</option>
          <option value="margin">צביעה: פער בין הגושים</option>
        </select>
        <select id="mapPotTarget" class="mapctl" aria-label="הגוש שלי">
          <option value="none">כל מי שלא הצביע</option>
          <option value="coalition">קואליציית 2022</option>
          <option value="opposition">אופוזיציה רחבה</option>
          <option value="other">רשימות אחרות</option>
        </select>
        <button class="btn" id="btnReset">מבט על כל העיר</button>
        <button class="btn" id="btnLabels" aria-pressed="false">שמות אתרים</button>
      </div>
      <div class="legendbox" id="legend"></div>
    </div>
  </div>

  <div class="modal hidden" id="about" role="dialog" aria-modal="true" aria-label="על הנתונים">
    <div class="modal-card">
      <div class="modal-head"><h2 id="aboutTitle">על הנתונים ועל שיטת העבודה</h2>
        <button class="btn" id="btnCloseAbout">סגירה</button></div>
      <div class="modal-body" id="aboutBody"></div>
    </div>
  </div>

  <div class="tableview hidden" id="tableview">
    <div class="tv-head">
      <strong>טבלת נתונים מלאה</strong>
      <div class="seg" id="tvSeg" style="width:280px">
        <button data-level="site" aria-pressed="true">לפי אתר הצבעה (140)</button>
        <button data-level="kalpi" aria-pressed="false">לפי קלפי (424)</button>
      </div>
      <span class="muted" id="tvCount"></span>
      <button class="btn" id="btnCloseTable" style="margin-inline-start:auto">סגירה</button>
    </div>
    <div class="tv-body" id="tvBody"></div>
  </div>
</div>

const potValue = s => (state.potTarget === 'none' ? s.non_voters : s.pot[state.potTarget]);
const potColor = s => {
  const b = POT_BINS[state.potTarget]; const v = potValue(s);
  let i = 0; while (i < b.length && v >= b[i]) i++;
  return cssVar(POT_VARS[state.potTarget][i]);
};

const colorOf = s => state.mode === 'lead' ? blocColor(s.lead)
  : state.mode === 'turnout' ? turnoutColor(s.turnout)
  : state.mode === 'delta' ? deltaColor(s)
  : state.mode === 'potential' ? potColor(s)
  : marginColor(s.margin);

// marker radius ~ sqrt(eligible voters) so the marker AREA is proportional to the
// size of the electorate the station serves — colour then shows how much of that
// electorate actually turned out. Scaled down when zoomed out so dense areas do
// not fuse into one blob.
const zoomScale = () => { const z = map.getZoom(); return z <= 12 ? 0.62 : z <= 13 ? 0.78 : z <= 14 ? 0.92 : z <= 16 ? 1 : 1.15; };
const baseRadius = (v, k = 0.235) => Math.max(3.2, Math.min(14, 1.2 + Math.sqrt(Math.max(0, v)) * k));
// Size is the electorate in EVERY mode, potential included — the mode changes the
// colour and nothing else. Sizing potential mode by the potential spent both channels
// on the same variable: a big marker was dark because it was big, and the map carried
// one number instead of two. With area on בעלי זכות and colour on the potential,
// "big and dark" says a large electorate with a lot of it still on the table, and
// "small and dark" — a modest electorate that barely voted — becomes visible too.
const radiusOf = s => baseRadius(s.eligible) * zoomScale();

const partyName = k => DATA.party_names[k] || k;
// one address arrives mangled from the official PDF; everything else is used verbatim
const ADDRESS_FIX = { 'פרץ י .ל20,.': 'י.ל. פרץ 20' };
const addressOf = s => ADDRESS_FIX[s.address] || s.address;
const signed = (n, d = 1) => (n > 0 ? '+' : '') + n.toFixed(d).replace(/\.0$/, '') + '%';

// ---------------------------------------------------------------- state
const state = {
  mode: 'potential',
  // the map opens on the group config names, not on the unattributed non-voter
  // count: it is a campaign tool, and DEFAULT_POT_TARGET says whose campaign
  potTarget: DATA.default_pot_target,
  q: '',
  turnoutMin: 0,
  turnoutMax: 100,
  blocs: new Set(['coalition', 'opposition', 'other']),
  sort: 'pot_desc',
  selected: null,
  labels: false,
  tableLevel: 'site',
  tableSort: { key: 'kalpi', dir: 1 },
};
const sites = DATA.sites;
const kalpiRows = sites.flatMap(s => s.kalpiot.map(k => ({ ...k, site: s.name, address: s.address, siteId: s.id })));
const kalpiNumKey = s => (s.kalpiot ? s.kalpiot[0].kalpi : s.kalpi).split('.').map(Number).reduce((a, b) => a * 1000 + b, 0);

function visible() {
  const q = state.q.trim();
  return sites.filter(s => {
    if (!state.blocs.has(s.lead)) return false;
    if (s.turnout < state.turnoutMin || s.turnout > state.turnoutMax) return false;
    if (q) {
      const hay = s.name + ' ' + s.address + ' ' + addressOf(s) + ' ' + s.kalpiot.map(k => k.kalpi + ' ' + k.barzel).join(' ');
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}
const SORTS = {
  pot_desc: (a, b) => potValue(b) - potValue(a),
  delta_asc: (a, b) => deltaNat(a) - deltaNat(b),
  kalpi: (a, b) => kalpiNumKey(a) - kalpiNumKey(b),
  turnout_desc: (a, b) => b.turnout - a.turnout,
  turnout_asc: (a, b) => a.turnout - b.turnout,
  voters_desc: (a, b) => b.voters - a.voters,
  coal_desc: (a, b) => share(b.coalition, b.valid) - share(a.coalition, a.valid),
  opp_desc: (a, b) => share(b.opposition, b.valid) - share(a.opposition, a.valid),
  // one "share of X" sort per camp, beside the blocs' own
  ...Object.fromEntries(CAMP_KEYS.map(c =>
    [`${c}_desc`, (a, b) => share(b[c], b.valid) - share(a[c], a.valid)])),
};

// ---------------------------------------------------------------- map
const map = L.map('map', { zoomControl: false, preferCanvas: false, attributionControl: true })
  .setView(DATA.city.center, DATA.city.zoom);
L.control.zoom({ position: 'topleft' }).addTo(map);
L.control.scale({ imperial: false, position: 'bottomleft', maxWidth: 120 }).addTo(map);

const TILE_URL = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
const ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · נתונים: ועדת הבחירות המרכזית';
let tileLayer = null;
function setTiles() {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark' ||
    (!document.documentElement.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
  if (!tileLayer) {
    tileLayer = L.tileLayer(TILE_URL, { attribution: ATTR, maxZoom: 19, crossOrigin: true }).addTo(map);
    tileLayer.setZIndex(0);
  }
  // the basemap is muted in CSS so the data markers stay the loudest thing on screen
  document.getElementById('map').classList.toggle('tiles-dark', dark);
}

const markerLayer = L.layerGroup().addTo(map);
const markers = new Map();

function tipHtml(s) {
  return `<b>${esc(s.name)}</b>
    <div class="r"><span>${esc(addressOf(s))}</span></div>
    <div class="r"><span>הצבעה ${pct(s.turnout)}</span><span>${signed(deltaNat(s))} מהארצי</span><span>${s.n_kalpi} קלפיות</span></div>
    <div class="r"><span>${POT_LABEL[state.potTarget]}: ${num(potValue(s))}</span><span>מתוך ${num(s.eligible)} בעלי זכות</span></div>
    <div class="lead"><span class="dot" style="background:${blocColor(s.lead)}"></span>
      <span>מוביל: ${BLOC_LABEL[s.lead]} · ${pct(share(s[s.lead], s.valid))}</span></div>`;
}

// The compact card a marker tap opens on a phone. There is no hover on touch, so
// a tap used to go straight to the full site panel — which meant leaving the map
// for another tab just to see what a circle was. The card answers that in place and
// keeps the trip to the full data an explicit choice.
function cardHtml(s) {
  return `<div class="mcard">
    <b>${esc(s.name)}</b>
    <div class="ad">${esc(addressOf(s))} · ${s.n_kalpi} קלפיות</div>
    <div class="row"><span>${POT_LABEL[state.potTarget]}</span><span class="v">${num(potValue(s))}</span></div>
    <div class="row"><span>אחוז הצבעה</span><span class="v">${pct(s.turnout)}
      <span class="muted" style="font-weight:400">${signed(deltaNat(s))} מהארצי</span></span></div>
    <div class="row"><span>גוש מוביל</span><span class="v">
      <span class="dot" style="background:${blocColor(s.lead)}"></span>${BLOC_LABEL[s.lead]}</span></div>
    <button class="btn primary mcard-more" data-id="${s.id}">כל הנתונים באתר</button>
  </div>`;
}

// Pointer devices get the hover tooltip; touch layouts get the tappable card.
// Rebound on layout change so a resize does not leave the wrong one attached.
function bindMarkerUI(m, s) {
  m.unbindTooltip(); m.unbindPopup();
  if (isNarrow()) {
    m.bindPopup(() => cardHtml(s), {
      className: 'mcard-popup', maxWidth: 260, minWidth: 200,
      autoPanPadding: [12, 12], closeButton: true,
    });
  } else {
    m.bindTooltip(tipHtml(s), { className: 'tip', direction: 'top', offset: [0, -6], sticky: false });
  }
}

function buildMarkers() {
  markerLayer.clearLayers(); markers.clear();
  for (const s of [...sites].sort((a, b) => b.eligible - a.eligible)) {   // small markers last = on top
    if (s.lat == null) continue;
    const m = L.circleMarker([s.lat, s.lon], {
      radius: radiusOf(s), color: cssVar('--ring'), weight: 1.5, opacity: 1,
      fillColor: colorOf(s), fillOpacity: 0.85, className: 'site-marker',
    });
    bindMarkerUI(m, s);
    // on a narrow layout the bound popup handles the tap; anywhere else a click
    // opens the full panel, which is already beside the map
    m.on('click', () => { if (!isNarrow()) selectSite(s.id, false); });
    m.on('keypress', () => selectSite(s.id, false));
    markers.set(s.id, m);
  }
  restyleMarkers();
}

// the card is plain HTML inside a Leaflet popup, so its button is delegated
map.getContainer().addEventListener('click', e => {
  const b = e.target.closest('.mcard-more');
  if (!b) return;
  map.closePopup();
  selectSite(+b.dataset.id, false);
});

function restyleMarkers() {
  const vis = new Set(visible().map(s => s.id));
  for (const s of sites) {
    const m = markers.get(s.id); if (!m) continue;
    const on = vis.has(s.id);
    if (on && !markerLayer.hasLayer(m)) markerLayer.addLayer(m);
    if (!on && markerLayer.hasLayer(m)) markerLayer.removeLayer(m);
    if (!on) continue;
    const sel = state.selected === s.id;
    m.setStyle({
      fillColor: colorOf(s), fillOpacity: sel ? 1 : 0.88,
      color: sel ? cssVar('--text-primary') : cssVar('--ring'), weight: sel ? 3 : 2,
    });
    m.setRadius(radiusOf(s) * (sel ? 1.25 : 1));
    if (sel) m.bringToFront();
  }
  updateLabels();
}

let labelLayer = L.layerGroup();
// Site labels are placed greedily, largest site first, and a label is dropped when
// its box would overlap one already placed — so dense areas stay readable.
function updateLabels() {
  labelLayer.clearLayers();
  if (!state.labels) { if (map.hasLayer(labelLayer)) map.removeLayer(labelLayer); return; }
  if (!map.hasLayer(labelLayer)) labelLayer.addTo(map);
  const bounds = map.getBounds().pad(0.02);
  const cand = visible().filter(s => s.lat != null && bounds.contains([s.lat, s.lon]))
    .sort((a, b) => b.eligible - a.eligible);
  const CH = 7.0, LH = 15;               // approx char width / line height at 11.5px
  const placed = [];
  const overlaps = (a, b) => !(a.r < b.l || a.l > b.r || a.bo < b.t || a.t > b.bo);
  for (const s of cand) {
    if (placed.length >= 70) break;
    const p = map.latLngToContainerPoint([s.lat, s.lon]);
    const w = Math.min(s.name.length * CH, 190);
    const y = p.y + radiusOf(s) + 1;
    const box = { l: p.x - w / 2 - 3, r: p.x + w / 2 + 3, t: y - 2, bo: y + LH + 2 };
    if (placed.some(q => overlaps(box, q))) continue;
    placed.push(box);
    L.marker([s.lat, s.lon], {
      icon: L.divIcon({ className: 'lbl-anchor', html: '', iconSize: [0, 0] }),
      interactive: false, keyboard: false })
      .bindTooltip(esc(s.name), { permanent: true, direction: 'bottom', className: 'lbl',
                                  offset: [0, radiusOf(s) - 2] })
      .addTo(labelLayer).openTooltip();
  }
  $('#btnLabels').title = `${placed.length} מתוך ${cand.length} שמות מוצגים — התקרבו כדי לראות עוד`;
}
map.on('zoomend', restyleMarkers);
map.on('moveend zoomend', () => { if (state.labels) updateLabels(); });

// ---------------------------------------------------------------- header stats
function renderStats() {
  const c = DATA.city;
  // first three ride along on mobile; the rest wait behind "עוד". The camp's own
  // potential leads: it is the number this map exists to hand a campaign.
  const tiles = [
    ...CAMP_KEYS.map(c => [`פוטנציאל ${campShort(c)}`, num(cityPot(c))]),
    ['קולות שלא הגיעו', num(c.non_voters)],
    ['אחוז הצבעה', pct(c.turnout)],
    ['פער מהארצי', signed(c.turnout - c.national_turnout)],
    ['אתרי הצבעה', num(c.n_sites)],
    ['קלפיות', num(c.n_kalpi)],
    ['בעלי זכות בחירה', num(c.eligible)],
    ['קולות כשרים', num(c.valid)],
  ];
  $('#stats').innerHTML = tiles.map(([k, v]) => `<div class="stat"><div class="v">${v}</div><div class="k">${k}</div></div>`).join('');
}

// ---------------------------------------------------------------- legend
function renderLegend() {
  const el = $('#legend');
  const vis = visible();
  if (state.mode === 'lead') {
    const counts = { coalition: 0, opposition: 0, other: 0 };
    vis.forEach(s => counts[s.lead]++);
    el.innerHTML = `<h3>הגוש המוביל באתר</h3>` + ['coalition', 'opposition', 'other'].map(b =>
      `<div class="legend-row"${counts[b] ? '' : ' style="opacity:.45"'}><span class="sw" style="background:${blocColor(b)}"></span><span>${BLOC_LABEL[b]}</span><span class="n">${counts[b]} אתרים</span></div>`).join('') + sizeLegend();
  } else if (state.mode === 'turnout') {
    el.innerHTML = `<h3>אחוז הצבעה באתר</h3>
      <div class="ramp">${TURNOUT_VARS.map(v => `<span style="background:${cssVar(v)}"></span>`).join('')}</div>
      <div class="ramp-labels"><span>עד ${TURNOUT_BINS[0]}%</span><span>${TURNOUT_BINS[2]}%</span><span>${TURNOUT_BINS[TURNOUT_BINS.length - 1]}%+</span></div>
      <p class="legend-note">סמן גדול ובהיר = ציבור בוחרים גדול שרבים בו לא הצביעו</p>` + sizeLegend();
  } else if (state.mode === 'delta') {
    // ramp is written darkest-first so the RIGHT-hand swatch under RTL is the
    // deepest deficit, and the labels are written in that same order
    const n = vis.filter(x => deltaNat(x) >= 0).length;
    el.innerHTML = `<h3>פער מאחוז ההצבעה הארצי</h3>
      <div class="ramp">${DELTA_VARS.map(v => `<span style="background:${cssVar(v)}"></span>`).join('')}</div>
      <div class="ramp-labels"><span>40-% ומטה</span><span>20-%</span><span>הארצי ומעלה</span></div>
      <p class="legend-note">הבסיס הוא אחוז ההצבעה הארצי בבחירות אלה (${pct(NAT)}), לא ממוצע העיר
         (${pct(DATA.city.turnout)}). ${n} מתוך ${vis.length} אתרים בתצוגה מגיעים לממוצע הארצי.</p>` + sizeLegend();
  } else if (state.mode === 'potential') {
    const b = POT_BINS[state.potTarget], vars = POT_VARS[state.potTarget];
    el.innerHTML = `<h3>${POT_LABEL[state.potTarget]}</h3>
      <div class="ramp">${vars.map(v => `<span style="background:${cssVar(v)}"></span>`).join('')}</div>
      <div class="ramp-labels"><span>עד ${num(b[0])}</span><span>${num(b[1])}</span><span>${num(b[b.length - 1])}+</span></div>
      <p class="legend-note">סמן גדול וכהה = ציבור בוחרים גדול שהרבה ממנו לא הגיע לקלפי
         (שטח = בעלי זכות, צבע = הפוטנציאל).</p>` + sizeLegend();
  } else {
    el.innerHTML = `<h3>פער בין הגושים (2022)</h3>
      <div class="ramp">${MARGIN_VARS.map(v => `<span style="background:${cssVar(v)}"></span>`).join('')}</div>
      <div class="ramp-labels"><span>אופוזיציה 30+</span><span>שוויון</span><span>קואליציה 30+</span></div>` + sizeLegend();
  }
}
function sizeLegend() {
  return `<div class="size-legend">${[700, 1600, 3500].map(v => {
    const r = baseRadius(v);
    return `<div class="b"><i style="width:${2 * r}px;height:${2 * r}px"></i><span>${num(v)}</span></div>`;
  }).join('')}<div class="b" style="align-self:center"><span>בעלי זכות בחירה<br>(שטח הסמן)</span></div></div>`;
}

// ---------------------------------------------------------------- list
function renderList() {
  const vis = visible().sort(SORTS[state.sort]);
  $('#count').textContent = `${vis.length} מתוך ${sites.length} אתרים`;
  const el = $('#list');
  if (!vis.length) { el.innerHTML = `<div class="empty">אין אתרים התואמים לסינון.</div>`; return; }
  el.innerHTML = vis.map(s => `
    <button class="site" data-id="${s.id}" aria-current="${state.selected === s.id}">
      <div class="t"><span class="dot" style="background:${colorOf(s)}"></span>
        <span class="nm">${esc(s.name)}</span>
        <span class="pill" style="margin-inline-start:auto">${s.n_kalpi} קלפיות</span></div>
      <div class="ad">${esc(addressOf(s))}</div>
      <div class="m"><span><b>${num(potValue(s))}</b> ${POT_LABEL[state.potTarget]}</span>
        <span>הצבעה ${pct(s.turnout)}</span><span>${signed(deltaNat(s))} מהארצי</span></div>
    </button>`).join('');
  $$('.site', el).forEach(b => b.addEventListener('click', () => selectSite(+b.dataset.id, true)));
}

// ---------------------------------------------------------------- detail
function blocStack(o) {
  const parts = [['coalition', o.coalition], ['opposition', o.opposition], ['other', o.other]];
  const t = o.valid || 1;
  return `<div class="stack">${parts.map(([k, v]) =>
    `<span style="width:${(100 * v / t).toFixed(2)}%;background:${blocColor(k)}" title="${BLOC_LABEL[k]}"></span>`).join('')}</div>
    <div class="stack-key">${parts.map(([k, v]) =>
      `<span class="i"><span class="dot" style="background:${blocColor(k)}"></span><span class="lbl">${BLOC_LABEL[k]}</span><span class="pc">${pct(share(v, t))}</span><span class="abs">${num(v)}</span></span>`).join('')}</div>`;
}

// The three blocs partition the vote, so they are always the bars. Each camp is
// appended after them: it overlaps the bar above it and must not read as a fourth
// slice of the same pie, so the sentence under the bars says so and the widths stay
// scaled to the largest BLOC — the camp's bar is visibly the part of one that it is.
const potBarKeys = () => ['coalition', 'opposition', 'other', ...CAMP_KEYS];
const potBarLabel = b => BLOC_LABEL[b] || campName(b);
const potBarColor = b => (BLOC_VAR[b] ? blocColor(b) : campColor(b));
const campOverlapNote = () => CAMP_KEYS.map(c =>
  ` ${campName(c)} נכללים גם בשורת ${campInside(c)} שמעליהם, ולכן הסכום כאן גדול ממספר מי שלא הצביעו.`).join('');

// The stack above shows the partition; a camp sits inside one of its slices, so it
// needs its own line or its number is nowhere in the site card.
function campLine(s) {
  return CAMP_KEYS.map(c => `<div class="stack-key" style="margin-top:6px">
    <span class="i"><span class="dot" style="background:${campColor(c)}"></span>
      <span class="lbl">${campName(c)}</span><span class="pc">${pct(share(s[c], s.valid))}</span>
      <span class="abs">${num(s[c])}</span></span></div>
    <p class="legend-note" style="margin:4px 0 0">${esc(campNote(c))} — הקולות כלולים גם בשורת ${campInside(c)} שלמעלה.
       פוטנציאל באתר: <b>${num(s.pot[c])}</b> קולות.</p>`).join('');
}

function renderDetail(s) {

  const maxParty = Math.max(...s.top_parties.map(p => p[1]), 1);
  const geoNote = s.geo_precision === 'venue' ? `מיקום המבנה לפי OpenStreetMap${s.osm_venue ? ' (' + esc(s.osm_venue) + ')' : ''}`

    : s.geo_precision === 'street' ? 'מיקום ברמת רחוב — הסמן על מרכז הרחוב, לא על המבנה'
    : 'מיקום מקורב';
  d.innerHTML = `
    <div class="detail-head">
      <div class="row">
        <div style="min-width:0">
          <h3>${esc(s.name)}</h3>
          <div class="ad">${esc(addressOf(s))}, ${esc(CITY)} · קלפיות ${s.kalpiot.map(k => esc(k.kalpi)).join(', ')}</div>
        </div>
        <button class="btn" id="closeDetail" style="margin-inline-start:auto">חזרה</button>
      </div>
      <div class="kpis">
        <div class="kpi"><div class="v">${pct(s.turnout)}</div><div class="k">אחוז הצבעה</div></div>
        <div class="kpi"><div class="v">${num(s.voters)}</div><div class="k">מצביעים</div></div>
        <div class="kpi"><div class="v">${num(s.eligible)}</div><div class="k">בעלי זכות</div></div>
        <div class="kpi"><div class="v">${num(s.non_voters)}</div><div class="k">לא הצביעו</div></div>
        <div class="kpi"><div class="v">${signed(deltaNat(s))}</div><div class="k">מהארצי ${pct(NAT)}</div></div>
        <div class="kpi"><div class="v">${signed(deltaCity(s))}</div><div class="k">${esc(FROM_CITY)} ${pct(DATA.city.turnout)}</div></div>
      </div>
      <div class="sec" style="padding:10px 0 0; border:0">
        <h4>פוטנציאל לפי גוש — הערכה</h4>
        <div class="bars">${potBarKeys().map(b => `
          <div class="bar"><span>${potBarLabel(b)}</span>
            <span class="track"><span class="fill" style="width:${(100 * s.pot[b] / Math.max(s.pot.coalition, s.pot.opposition, s.pot.other, 1)).toFixed(1)}%;background:${potBarColor(b)}"></span></span>
            <span class="val">${num(s.pot[b])} קולות</span></div>`).join('')}</div>
        <p class="legend-note">${num(s.non_voters)} בעלי זכות לא הצביעו כאן. החלוקה לגושים מניחה

      </div>
      <span class="warn">📍 ${geoNote}${s.jittered ? ' · הוזז מעט כדי להפריד סמנים חופפים' : ''}</span>
    </div>
    <div class="scroll">
      <div class="sec"><h4>חלוקה לגושים</h4>${blocStack(s)}${campLine(s)}</div>
      <div class="sec"><h4>המפלגות הגדולות באתר</h4>
        <div class="bars">${s.top_parties.map(([k, v]) => `
          <div class="bar"><span>${esc(partyName(k))}</span>
            <span class="track"><span class="fill" style="width:${(100 * v / maxParty).toFixed(1)}%;background:${cssVar('--accent')}"></span></span>
            <span class="val">${num(v)} · ${pct(share(v, s.valid))}</span></div>`).join('')}</div>
      </div>
      <details class="sec"><summary>פירוט לפי קלפי (${s.n_kalpi})</summary>

        <tbody>${s.kalpiot.map(k => `<tr>
          <td>${esc(k.kalpi)}</td><td class="muted">${k.barzel}</td><td>${num(k.eligible)}</td>
          <td>${num(k.voters)}</td><td>${pct(k.turnout)}</td>

        </tr>`).join('')}</tbody></table>

        <table class="kt"><tbody>${Object.entries(s.parties).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1])
          .map(([k, v]) => `<tr><td>${esc(partyName(k))} <span class="muted">(${esc(k)})</span></td><td style="text-align:end">${num(v)}</td><td style="text-align:end" class="muted">${pct(share(v, s.valid))}</td></tr>`).join('')}
          <tr><td><b>קולות פסולים</b></td><td style="text-align:end">${num(s.invalid)}</td><td></td></tr>
        </tbody></table>
      </div>
    </div>`;
  d.classList.remove('hidden');
  $('#closeDetail').addEventListener('click', () => selectSite(null));
}

function selectSite(id, fly) {
  state.selected = id;
  // on a phone the detail lives in the list pane, so a marker tap must switch to it
  if (id != null && isNarrow()) setView('list');
  if (id == null) { $('#detail').classList.add('hidden'); }
  else {
    const s = sites.find(x => x.id === id);
    renderDetail(s);
    if (s.lat != null) {
      if (fly) map.flyTo([s.lat, s.lon], Math.max(map.getZoom(), 16), { duration: 0.6 });
      if (!isNarrow()) markers.get(id)?.openTooltip();
    }
  }
  restyleMarkers(); renderList();
}

// sits in, and six columns is the ceiling.
const MOBILE_KEYS = ['name', 'turnout', 'dnat', 'nonv', ...CAMP_KEYS.map(c => `pot_${c}`), 'poto'];

function renderTable() {
  const site = state.tableLevel === 'site';
  const allCols = site ? SITE_COLS : KALPI_COLS;
  let cols = allCols;
  if (isNarrow()) {
    const sub = cols.filter(c => MOBILE_KEYS.includes(c[0]));
    if (sub.length) cols = sub;
  }
  const visIds = new Set(visible().map(s => s.id));
  let rows = site ? visible() : kalpiRows.filter(k => visIds.has(k.siteId));
  const col = allCols.find(c => c[0] === state.tableSort.key) || cols[0];
  rows = [...rows].sort((a, b) => {
    const x = col[3](a), y = col[3](b);
    return (typeof x === 'string' ? x.localeCompare(y, 'he') : x - y) * state.tableSort.dir;
  });
  $('#tvCount').textContent = `${num(rows.length)} שורות (לפי הסינון הפעיל)`;
  $('#tvBody').innerHTML = `<table class="full"><thead><tr>${cols.map(c =>
    `<th data-key="${c[0]}" ${state.tableSort.key === c[0] ? `aria-sort="${state.tableSort.dir > 0 ? 'ascending' : 'descending'}"` : ''}>${c[1]}${state.tableSort.key === c[0] ? (state.tableSort.dir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr>${cols.map(c => `<td>${c[2](r)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  $$('#tvBody th').forEach(th => th.addEventListener('click', () => {
    const k = th.dataset.key;
    state.tableSort = { key: k, dir: state.tableSort.key === k ? -state.tableSort.dir : 1 };
    renderTable();
  }));
}

// The colour mode has two controls bound to the same state: the segmented control in
// the filter panel, and a compact pair of selects on the map bar that only the narrow
// layout shows. Below 1000px the panel lives on the OTHER tab, so choosing a mode cost
// three taps and you never saw the map you were painting. Every change goes through
// these setters so the two controls can never disagree.
function setMode(m) {
  state.mode = m;
  $$('#modeSeg button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.mode === m)));
  $('#mapMode').value = m;
  syncPotField();
  renderAll();
}
function setPotTarget(t) {
  state.potTarget = t;
  $('#potTarget').value = t;
  $('#mapPotTarget').value = t;
  // a camp needs its caveat where it is picked; a bloc carries none
  $('#potNote').textContent = isCamp(t) ? campNote(t) : '';
  renderAll();
}
// A camp is not in the static markup — it comes from config, so its options are
// inserted into the two group selects and the sort at start-up. Right after
// "everyone who did not vote", so the reader's own group is the first real choice.
function injectCampOptions() {
  for (const sel of ['#potTarget', '#mapPotTarget']) {
    const el = $(sel);
    CAMP_KEYS.forEach((c, i) => el.add(new Option(campName(c), c), 1 + i));
  }
  const sort = $('#sort');
  const at = [...sort.options].findIndex(o => o.value === 'opp_desc') + 1;
  CAMP_KEYS.forEach((c, i) => sort.add(new Option(`שיעור ${campName(c)}`, `${c}_desc`), at + i));
}
$('#modeSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  setMode(b.dataset.mode);
});
$('#mapMode').addEventListener('change', e => setMode(e.target.value));
// the bloc target only means anything in potential mode, but it also decides what
// the list sorts by, so in the panel it stays reachable whenever that sort is active.
// On the map bar it follows the mode alone — the sort control is not on that tab.
function syncPotField() {
  const on = state.mode === 'potential' || state.sort === 'pot_desc';
  $('#potTargetField').classList.toggle('hidden', !on);
  $('#mapPotTarget').classList.toggle('hidden', state.mode !== 'potential');
}
$('#potTarget').addEventListener('change', e => setPotTarget(e.target.value));
$('#mapPotTarget').addEventListener('change', e => setPotTarget(e.target.value));
$('#q').addEventListener('input', e => { state.q = e.target.value; renderAll(); });
function syncTurnoutRange(changed) {
  let lo = +$('#turnoutMin').value, hi = +$('#turnoutMax').value;
  if (lo > hi) {                    // push the other handle so they never cross
    if (changed === 'min') hi = lo, $('#turnoutMax').value = hi;
    else lo = hi, $('#turnoutMin').value = lo;
  }
  state.turnoutMin = lo; state.turnoutMax = hi;
  $('#turnoutVal').textContent = `${lo}%–${hi}%`;
  renderAll();
}

$('#btnTheme').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') ||
    (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  $('#btnTheme').textContent = next === 'dark' ? 'מצב בהיר' : 'מצב כהה';
  setTiles(); renderAll();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (!$('#about').classList.contains('hidden')) $('#about').classList.add('hidden');
    else if (!$('#tableview').classList.contains('hidden')) $('#tableview').classList.add('hidden');
    else if (state.selected != null) selectSite(null);
  }
});

// ---------------------------------------------------------------- mobile shell
// Below 1000px the map and the list are separate tabs. They used to be stacked
// inside a 100vh box that could not scroll, which left the filters and the whole
// list off-screen and unreachable on any phone.
function setView(v) {
  document.body.dataset.view = v;
  map.closePopup();          // it would otherwise linger, hidden, behind the other tab
  $$('#viewTabs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === v)));
  // the map was display:none, so Leaflet has to re-measure before it draws
  if (v === 'map') setTimeout(() => { map.invalidateSize(); updateLabels(); }, 0);
}
$('#viewTabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  setView(b.dataset.view);
});
$('#btnMenu').addEventListener('click', e => {
  const open = $('#hdrActions').classList.toggle('open');
  e.currentTarget.setAttribute('aria-expanded', String(open));
});
$('#hdrActions').addEventListener('click', () => {
  $('#hdrActions').classList.remove('open');
  $('#btnMenu').setAttribute('aria-expanded', 'false');
});
document.addEventListener('click', e => {
  if (!e.target.closest('#hdrActions') && !e.target.closest('#btnMenu')) {
    $('#hdrActions').classList.remove('open');
    $('#btnMenu').setAttribute('aria-expanded', 'false');
  }
});
$('#btnStatsMore').addEventListener('click', e => {
  const open = $('#stats').classList.toggle('expanded');
  e.currentTarget.textContent = open ? 'פחות' : 'עוד';
  e.currentTarget.setAttribute('aria-expanded', String(open));
});
const MODE_LABEL = {
  potential: 'פוטנציאל', turnout: 'אחוז הצבעה', delta: 'פער מהארצי',
  lead: 'גוש מוביל', margin: 'פער בין הגושים',
};
// The row below already prints the count, so the folded summary says what is ACTIVE:
// the colour mode, plus a note when a filter is hiding sites.
function syncFilterSummary() {
  const n = visible().length;
  const filtered = n < sites.length;
  $('#filtSummary').textContent = MODE_LABEL[state.mode] + (filtered ? ` · מסונן (${n})` : '');
}

function fitAll() {
  const pts = sites.filter(s => s.lat != null).map(s => [s.lat, s.lon]);
  if (pts.length) map.fitBounds(L.latLngBounds(pts), { padding: [40, 40] });
}

setTiles();
renderStats();
buildMarkers();
// the camps join the selects before anything reads their value, and the controls
// start on whatever `state` declares above, not on whatever option the markup lists first
injectCampOptions();
setPotTarget(state.potTarget);
renderLegend();
renderList();
fitAll();
syncPotField();
syncFilterSummary();
setView('map');
// on a phone the filters start folded so the list gets the screen; on a desktop
// the <details> is always open and its summary is hidden by CSS
if (isNarrow()) $('#filters').open = false;
// the table's column set and the filter fold depend on width, so follow resizes
matchMedia('(max-width:1000px)').addEventListener('change', () => {
  if (!$('#tableview').classList.contains('hidden')) renderTable();
  $('#filters').open = !isNarrow();
  map.closePopup();
  for (const s of sites) { const m = markers.get(s.id); if (m) bindMarkerUI(m, s); }
  map.invalidateSize();
});
$('#btnTheme').textContent = matchMedia('(prefers-color-scheme: dark)').matches ? 'מצב בהיר' : 'מצב כהה';
window.__READY__ = true;

</script>
</body>
</html>
